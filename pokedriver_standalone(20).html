<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>驾考保卫战 - 宝可梦版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
:root{
  --bg:#0a0a1a;--bg2:#0f0f2a;--surface:#1a1a3a;--border:#2a2a5a;
  --cyan:#00f0ff;--magenta:#ff00ff;--gold:#ffd700;--green:#00ff88;
  --red:#ff0044;--text:#d0d0ff;--text2:#8080cc;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
body{
  background:var(--bg);color:var(--text);font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
  min-height:100vh;overflow:hidden;user-select:none;
  padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar);
}
#game-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:10px 12px;padding-bottom:calc(10px + var(--sab));height:100vh;height:100dvh;display:flex;flex-direction:column}
.tab-bar{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px;flex-shrink:0;margin-bottom:6px}
.tab-btn{flex:1;padding:8px 8px;border:none;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:transparent;color:var(--text2);transition:all 0.15s;touch-action:manipulation}
.tab-btn.active{background:var(--surface);color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,0.08)}
.header{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;flex-shrink:0}
.header .title{font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .stats{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.header .stats .stat{padding:2px 8px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}
.header .stats .stat .val{font-weight:700;color:var(--cyan)}
.header .stats .stat .val.hp-ok{color:var(--green)}
.header .stats .stat .val.hp-warn{color:var(--gold)}
.header .stats .stat .val.hp-danger{color:var(--red)}
.game-area{position:relative;margin:6px 0;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);flex:none;height:48vh;min-height:260px}
#monster-lane{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,transparent 60%,rgba(0,240,255,0.02))}
.monster{position:absolute;text-align:center;padding:6px;z-index:10;will-change:top;width:80px}
.monster .m-img{width:50px;height:50px;image-rendering:pixelated;display:block;margin:0 auto}
.monster .m-img-fallback{width:50px;height:50px;display:flex;align-items:center;justify-content:center;margin:0 auto;border-radius:50%;font-size:22px;font-weight:900}

.monster .m-hp-wrapper{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.monster .m-hp-fill{height:100%;border-radius:2px;transition:width 0.15s}
.monster.taking-damage .m-img{animation:dmgBounce 0.25s ease}
@keyframes dmgBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.defense-line{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:4px;display:flex;align-items:center;justify-content:center}
.defense-line .license-icon{display:inline-flex;align-items:center;padding:4px}
.defense-line .license-icon img{width:60px;height:60px;image-rendering:pixelated}
.defense-line .license-icon .fallback-text{font-size:48px;line-height:120px}
.defense-line .license-icon{font-size:20px;display:block}
.question-area{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px 14px;flex-shrink:0}
.q-number{font-size:11px;color:var(--text2);margin-bottom:3px}
.q-text{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:8px;min-height:38px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.option-btn{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;transition:all 0.15s;line-height:1.3;min-height:40px}
.option-btn:hover{background:var(--bg);border-color:var(--cyan)}
.option-btn.disabled{pointer-events:none;opacity:0.6}
.option-btn.correct{background:rgba(0,255,136,0.1);border-color:var(--green)}
.option-btn.wrong{background:rgba(255,0,68,0.1);border-color:var(--red)}
.upgrade-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:8px 12px;flex-shrink:0;margin-top:4px}
.upgrade-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.upgrade-gold{font-size:13px;font-weight:700;color:var(--gold)}
.upgrade-btns{display:flex;gap:6px;flex-wrap:wrap}
.upgrade-btn-sm{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.2}
.upgrade-btn-sm:hover{background:var(--bg);border-color:var(--gold)}
.upgrade-btn-sm.disabled{opacity:0.4;cursor:not-allowed}
.upgrade-btn-sm .cost{color:var(--gold);font-weight:700}
.upgrade-btn-sm .lbl{color:var(--text2);display:block;font-size:9px}
.footer{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 2px;font-size:10px;color:var(--text2);flex-shrink:0;gap:6px;flex-wrap:wrap}
.footer input[type=file]{display:none}
.import-btn,.reset-btn{padding:5px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:10px;cursor:pointer;font-family:inherit}
.import-btn:hover,.reset-btn:hover{background:var(--bg);border-color:var(--cyan);color:var(--text)}
.reset-btn:hover{border-color:var(--red);color:var(--red)}
.combo-notify{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;font-size:24px;font-weight:900;pointer-events:none;text-shadow:0 0 20px rgba(255,215,0,0.5);animation:comboPop 1s ease-out forwards}
@keyframes comboPop{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)}50%{opacity:1;transform:translate(-50%,-60%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.game-over-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.85);z-index:100;justify-content:center;align-items:center;flex-direction:column;gap:12px;border-radius:14px;backdrop-filter:blur(8px)}
.game-over-overlay.show{display:flex}
.go-title{font-size:28px;font-weight:900;color:var(--red)}
.go-stats{font-size:14px;text-align:center;line-height:2}
.go-stats span{color:var(--cyan);font-weight:700}
.restart-btn{padding:12px 36px;background:linear-gradient(135deg,var(--cyan),var(--magenta));border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.start-overlay{display:flex;position:absolute;inset:0;background:rgba(0,0,0,0.88);z-index:100;justify-content:center;align-items:center;flex-direction:column;gap:10px;border-radius:14px;backdrop-filter:blur(8px);padding:20px}
.start-overlay .start-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.start-overlay .start-sub{font-size:12px;color:var(--text2);text-align:center;line-height:1.8}
.start-overlay .start-btn{padding:14px 40px;background:linear-gradient(135deg,var(--cyan),var(--magenta));border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(0,240,255,0.3)}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;justify-content:center;align-items:center;padding:20px;backdrop-filter:blur(4px)}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 24px;max-width:340px;width:100%;text-align:center}
.confirm-box .confirm-text{font-size:14px;line-height:1.6;margin-bottom:16px}
.confirm-box .confirm-btns{display:flex;gap:10px;justify-content:center}
.confirm-box button{padding:8px 24px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px}
.confirm-box .btn-cancel{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.confirm-box .btn-confirm{background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#fff}

/* === POKEDEX === */
.pokedex-area{flex:1;display:none;flex-direction:column;margin:6px 0;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);min-height:0}
.pokedex-area.active{display:flex}
.pokedex-header{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;gap:6px}
.pokedex-header .info{font-size:11px;color:var(--text2)}
.pokedex-header .info span{color:var(--cyan);font-weight:700}
.pokedex-gacha{display:flex;gap:6px;align-items:center}
.gacha-btn{padding:6px 14px;background:linear-gradient(135deg,#ff6d00,#ff0044);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 2px 10px rgba(255,0,68,0.3)}
.gacha-btn:active{transform:scale(0.97)}
.gacha-btn:disabled{opacity:0.4;cursor:not-allowed}
.pokedex-grid{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.pokedex-grid::-webkit-scrollbar{width:4px}
.pokedex-grid::-webkit-scrollbar-track{background:transparent}
.pokedex-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.pkm-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;touch-action:manipulation}
.pkm-card:hover{border-color:var(--cyan)}
.pkm-card.active{border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,0.15)}
.pkm-card.locked{opacity:0.5}
.pkm-card .pkm-id{font-size:8px;color:var(--text2);position:absolute;top:2px;left:4px}
.pkm-card .pkm-img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:4px auto;object-fit:contain}
.pkm-card .pkm-img-fallback{width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:4px auto;border-radius:50%;font-size:20px;font-weight:900}
.pkm-card .pkm-name{font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkm-card .pkm-progress{font-size:7px;color:var(--gold);margin-top:1px}
.pkm-card .pkm-using{font-size:9px;color:var(--green);position:absolute;top:2px;right:4px}
.pkm-card .pkm-rarity{position:absolute;bottom:2px;right:3px;font-size:8px}
.pkm-card.rarity-u{border-color:rgba(0,240,255,0.3)}
.pkm-card.rarity-r{border-color:rgba(255,215,0,0.3)}
.pkm-card.rarity-l{border-color:rgba(255,0,68,0.3)}

/* === BANK === */
.bank-area{flex:1;display:none;flex-direction:column;margin:6px 0;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);min-height:0}
.bank-area.active{display:flex}
.bank-search{padding:8px 10px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bank-search input{flex:1;min-width:100px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;outline:none}
.bank-search input:focus{border-color:var(--cyan)}
.bank-search .bank-count{font-size:10px;color:var(--text2);white-space:nowrap}
.bank-list{flex:1;overflow-y:auto;padding:4px 8px;scrollbar-width:thin}
.bank-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:4px;overflow:hidden;cursor:pointer}
.bank-item:hover{border-color:var(--cyan)}
.bank-item.expanded{border-color:var(--cyan)}
.bank-item-header{display:flex;align-items:flex-start;gap:6px;padding:8px 10px}
.bank-item .q-num{font-size:10px;color:var(--text2);font-weight:700;background:var(--bg);padding:2px 5px;border-radius:4px;flex-shrink:0}
.bank-item .q-preview{flex:1;font-size:12px;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bank-item .q-toggle{font-size:12px;color:var(--text2);flex-shrink:0;transition:transform 0.2s}
.bank-item.expanded .q-toggle{transform:rotate(180deg)}
.bank-item-detail{display:none;padding:0 10px 10px;border-top:1px solid var(--border)}
.bank-item.expanded .bank-item-detail{display:block}
.bank-item-detail .detail-opt{padding:3px 6px;margin:1px 0;border-radius:4px;font-size:12px}
.bank-item-detail .detail-opt.is-ans{background:rgba(0,255,136,0.08);color:var(--green)}
.bank-item-detail .detail-ans{font-size:11px;color:var(--green);font-weight:700;margin:3px 0}
.bank-pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:6px 10px;flex-shrink:0;border-top:1px solid var(--border)}
.bank-pagination button{padding:4px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;cursor:pointer;font-family:inherit}
.bank-pagination button:disabled{opacity:0.3;cursor:not-allowed}
.bank-pagination .page-info{font-size:10px;color:var(--text2)}

@media(max-width:480px){
  #app{padding:6px 8px;padding-bottom:calc(6px + var(--sab))}
  .options{grid-template-columns:1fr}
  .pokedex-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .header .title{font-size:12px}
  .tab-btn{font-size:11px;padding:6px 6px}
  .defense-line .license-icon img{width:50px;height:50px}
  .defense-line .license-icon .fallback-text{font-size:40px;line-height:100px}
}
@media(min-width:481px) and (max-width:767px){
  .pokedex-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
@media(min-width:768px){
  .pokedex-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
}
.filter-btn{padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.15s;touch-action:manipulation}.filter-btn.active{background:var(--surface);border-color:var(--cyan);color:var(--cyan)}.filter-btn:hover{border-color:var(--cyan)}.pkm-tier-badge{position:absolute;top:2px;right:2px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:4px;line-height:1.3;z-index:2}.pkm-tier-badge.t1{background:rgba(255,0,68,0.2);color:#ff0044;border:1px solid rgba(255,0,68,0.3)}.pkm-tier-badge.t2{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.3)}.pkm-tier-badge.myth{background:rgba(255,0,255,0.15);color:#ff00ff;border:1px solid rgba(255,0,255,0.3)}#skill-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:20;width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--surface);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;transition:all 0.3s;touch-action:manipulation;padding:0;font-family:inherit;line-height:1}#skill-btn .charge-bar{position:absolute;bottom:-3px;left:-3px;right:-3px;height:4px;border-radius:2px;background:var(--bg);overflow:hidden}#skill-btn .charge-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width 0.3s;width:0%}#skill-btn .charge-text{font-size:8px;color:var(--text2);font-weight:700;line-height:1}#skill-btn.ready{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,0.4);animation:skillPulse 0.8s ease-in-out infinite alternate}#skill-btn.ready .charge-fill{background:linear-gradient(90deg,var(--gold),#ff8800)}#skill-btn.ready .charge-text{color:var(--gold)}#skill-btn:active{transform:translateY(-50%) scale(0.9)}@keyframes skillPulse{0%{box-shadow:0 0 10px rgba(255,215,0,0.3)}100%{box-shadow:0 0 30px rgba(255,215,0,0.7)}}#screen-flash{position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;transition:opacity 0.15s}#screen-flash.show{opacity:1}</style>

<body>
<canvas id="game-canvas"></canvas>
<div id="app">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('battle')">⚔️ 闯关</button>
    <button class="tab-btn" onclick="switchTab('bank')">📚 题库</button>
    <button class="tab-btn" onclick="switchTab('pokedex')">📖 图鉴</button>
  </div>
  <div class="header" id="battle-header">
    <div class="title">👾宝可驾🚗</div>
    <div class="stats">
      <span class="stat"><span class="label">❤️</span><span class="val hp-ok" id="hp-display">100</span></span>
      <span class="stat"><span class="label">⭐</span><span class="val" id="score-display">0</span></span>
      <span class="stat"><span class="label">🔥</span><span class="val" id="combo-display">0</span></span>
    </div>
  </div>
  <div class="game-area" id="game-area">
    <div id="monster-lane"></div>
    <div class="defense-line"><span class="license-icon" id="defense-icon"></span></div>
    <button id="skill-btn" onclick="activateSkill()" title="必杀技">⚡<span class="charge-text" id="skill-charge-text">0%</span><span class="charge-bar"><span class="charge-fill" id="skill-charge-fill"></span></span></button>
    <div id="screen-flash"></div>
    <div class="game-over-overlay" id="game-over">
      <div class="go-title">💀 考砸了</div>
      <div class="go-stats">⭐ <span id="go-score">0</span><br>✅ 正确率: <span id="go-rate">0%</span><br>🔥 最高连击: <span id="go-combo">0</span></div>
      <button class="restart-btn" onclick="restartGame()">🔄 重新考试</button>
    </div>
    <div class="start-overlay" id="start-screen">
      <div class="start-title">👾宝可驾🚗</div>
      <div class="start-sub" style="font-size:14px;margin:4px 0">
        ⚡ 上阵宝可梦: <span id="start-pkm">皮卡丘</span><br>
        答对题目发射子弹 · 击败宝可梦解锁收集！
      </div>
      <div class="start-features" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0">
        <span style="padding:3px 10px;background:var(--surface);border-radius:8px;font-size:11px">📖 全图鉴收集</span>
        <span style="padding:3px 10px;background:var(--surface);border-radius:8px;font-size:11px">🎰 抽奖系统</span>
        <span style="padding:3px 10px;background:var(--surface);border-radius:8px;font-size:11px">🔥 连击系统</span>
      </div>
      <button class="start-btn" onclick="startGame()">🎮 开始冒险</button>
    </div>
  </div>
  <div class="question-area" id="question-area">
    <div class="q-number" id="q-number">第 1 题</div>
    <div class="q-text" id="q-text">加载题目中...</div>
    <div class="options" id="options"></div>
  </div>
  <div class="upgrade-panel" id="upgrade-panel">
    <div class="upgrade-row">
      <span class="upgrade-gold">💰 <span id="gold-display">0</span></span>
      <div class="upgrade-btns">
        <button class="upgrade-btn-sm" id="upgrade-bullet-btn" onclick="upgradeBullet()">
          <span class="lbl">🔫 伤害</span><span class="val" id="bullet-level-display">Lv.1</span><span class="cost" id="bullet-cost-display">30g</span>
        </button>
        <button class="upgrade-btn-sm" id="upgrade-hp-btn" onclick="upgradeHP()">
          <span class="lbl">❤️ 生命</span><span class="val" id="hp-level-display">Lv.1</span><span class="cost" id="hp-cost-display">20g</span>
        </button>
        <button class="upgrade-btn-sm" id="gacha-quick-btn" onclick="doGacha()">
          <span class="lbl">🎰 抽奖</span><span class="cost">200g</span>
        </button>
      </div>
    </div>
  </div>

  <!-- POKEDEX -->
  <div class="pokedex-area" id="pokedex-area">
    <div class="pokedex-header">
      <div class="info">📖 图鉴 · 已解锁 <span id="pokedex-unlocked">0</span>/<span id="pokedex-total">0</span></div>
      <div class="pokedex-filter" style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="filter-btn active" data-filter="all" onclick="setPokeFilter('all')">全部</button>
        <button class="filter-btn" data-filter="unlocked" onclick="setPokeFilter('unlocked')">已解锁</button>
      </div>
      <div class="pokedex-gacha">
        <button class="gacha-btn" onclick="doGacha()">🎰 抽奖 200💰</button>
      </div>
    </div>
    <div class="pokedex-grid" id="pokedex-grid"></div>
  </div>

  <!-- QUESTION BANK -->
  <div class="bank-area" id="bank-area">
    <div class="bank-search">
      <input type="text" id="bank-search-input" placeholder="🔍 搜索题目..." oninput="filterBank()">
      <span class="bank-count" id="bank-count">共 0 题</span>
    </div>
    <div class="bank-list" id="bank-list"></div>
    <div class="bank-pagination">
      <button onclick="bankPage(-1)" id="bank-prev">◀</button>
      <span class="page-info" id="bank-page-info">第 1/1 页</span>
      <button onclick="bankPage(1)" id="bank-next">▶</button>
    </div>
  </div>

  <div class="footer">
    <label class="import-btn">📂 导入题库<input type="file" accept=".json,.txt" onchange="importQuestions(event)"></label>
    <span id="today-stats">今日: 0题 0%</span>
    <span style="color:var(--gold);font-size:11px">🏆 <span id="best-score-display">—</span></span>
    <button class="reset-btn" onclick="confirmReset()">🔄 重置</button>
  </div>
</div>

// ============================================================
//  POKEMON HELPERS
// ============================================================
function getPkm(id) { return PKM.find(p => p.id === id); }
function getPkmName(id) { const p = getPkm(id); return p ? p.c : '???' ; }
function getPkmIcon(id) {
  // 优先使用内嵌 base64 图标（手机端兼容），失败回退文件路径
  if (typeof POKEMON_ICONS !== 'undefined' && POKEMON_ICONS[id]) return POKEMON_ICONS[id];
  return 'pokemon/icons/' + id + '.png';
}
function hasPkmIcon(id) { const p = getPkm(id); return p && p.i === 1; }
function pkmFallbackColor(id) {
  const colors = ['#00f0ff','#ff00ff','#ffd700','#00ff88','#ff0044','#ff8800','#8844ff','#00ddff'];
  return colors[Math.abs(id || 0) % colors.length];
}
function pkmIconOnError(el, pkmId, pkmName) {
  if (el.dataset.fallbackSet) return;
  el.dataset.fallbackSet = '1';
  const color = pkmFallbackColor(pkmId);
  const initial = (pkmName || '?').charAt(0);
  const w = el.width || el.style.width || 40;
  const h = el.height || el.style.height || 40;
  // Replace img with a colored circle + initial letter
  const parent = el.parentNode;
  const fallback = document.createElement('div');
  fallback.className = el.className.replace('m-img','m-img-fallback').replace('pkm-img','pkm-img-fallback');
  fallback.style.cssText = el.style.cssText + ';background:' + color + '33;color:' + color + ';border:2px solid ' + color + ';border-radius:50%;display:flex;align-items:center;justify-content:center';
  fallback.textContent = initial;
  parent.replaceChild(fallback, el);
}
function isPkmUnlocked(id) { return !!G.unlocked[id]; }
function getPkmKills(id) { return G.pokeKills[id] || 0; }
function isPkmUnlockable(id) { const p = getPkm(id); return p && p.i === 1; }
function getRarityLabel(r) { return {c:'普通',u:'稀有',r:'珍贵',l:'传说'}[r] || '普通'; }
function getRarityEmoji(r) { return {c:'',u:'🔵',r:'🌟',l:'👑'}[r] || ''; }

function getPkmHP(p) {
  const rMult = {c:1, u:1.5, r:2.2, l:3.5};
  const hp = Math.round(2 + (p.id % 5) * (rMult[p.r] || 1));
  return Math.min(hp, 12);
}
function getPkmSpeed(p) {
  const rMult = {c:1, u:1.15, r:1.3, l:1.5};
  return (16 + (p.id % 10)) * (rMult[p.r] || 1);
}
function getLegendTier(id) {
  if (TIER1_LEGEND.has(id)) return {emoji:'👑',label:'一级神',cls:'t1'};
  if (TIER2_LEGEND.has(id)) return {emoji:'⚡',label:'二级神',cls:'t2'};
  if (MYTHICAL_PKMN.has(id)) return {emoji:'🌟',label:'幻兽',cls:'myth'};
  return null;
}

function getPkmSpawnWeight(p) {
  if (TIER1_LEGEND.has(p.id) || MYTHICAL_PKMN.has(p.id)) return 1;
  if (TIER2_LEGEND.has(p.id)) return 3;
  const weights = {c:30, u:15, r:6, l:2};
  return weights[p.r] || 10;
}

// ============================================================
//  PARTICLES
// ============================================================
let particles = [], bgParticles = [];
let canvasW = 0, canvasH = 0;
function resizeCanvas() { canvasW = window.innerWidth; canvasH = window.innerHeight; dom.canvas.width = canvasW; dom.canvas.height = canvasH; }
window.addEventListener('resize', resizeCanvas);
function initBgParticles() {
  bgParticles = [];
  for (let i = 0; i < 50; i++) bgParticles.push({ x: Math.random() * canvasW, y: Math.random() * canvasH, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 2 + 0.5, alpha: Math.random() * 0.4 + 0.1, hue: Math.random() < 0.5 ? 180 : 300 });
}
function spawnExplosion(x, y, color, count = 20) {
  for (let i = 0; i < count; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 1; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, r: Math.random() * 4 + 2, life: 1, decay: 0.015 + Math.random() * 0.02, color: color || `hsl(${Math.random()*60+180},100%,60%)` }); }
}
function renderParticles() {
  const ctx = dom.canvas.getContext('2d');
  ctx.clearRect(0, 0, canvasW, canvasH);
  bgParticles.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = canvasW; if (p.x > canvasW) p.x = 0; if (p.y < 0) p.y = canvasH; if (p.y > canvasH) p.y = 0; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.alpha})`; ctx.fill(); });
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.99; p.life -= p.decay; if (p.life <= 0) { particles.splice(i, 1); continue; } ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill(); ctx.globalAlpha = 1; }
  G.monsters.forEach(m => { if (m.dead || !m.el || !m.el.isConnected) return; const r = m.el.getBoundingClientRect(); ctx.beginPath(); ctx.arc(r.left + r.width / 2, r.top + r.height / 2, 22, 0, Math.PI * 2); ctx.fillStyle = (m.pokeData ? (m.pokeData.r === 'l' ? 'rgba(255,0,68,0.08)' : 'rgba(0,240,255,0.05)') : '#00f0ff08'); ctx.fill(); });
  requestAnimationFrame(renderParticles);
}

// ============================================================
//  MONSTERS (Pokemon version)
// ============================================================
function spawnMonster() {
  if (G.gameOver || G.isLoading || G.monsters.length >= 6) return;
  // 所有宝可梦都能作为怪物出现（包括未解锁的）
  const pool = PKM;
  if (pool.length === 0) return;
  const weights = pool.map(p => getPkmSpawnWeight(p));
  const totalW = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * totalW;
  let idx = 0;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) { idx = i; break; } }
  const pkm = pool[idx];
  const speedBoost = 1 + (G.speedLevel - 1) * 0.35;
  const hp = Math.min(Math.ceil(getPkmHP(pkm) + (G.speedLevel - 1) * 0.5), 10);
  const monster = {
    id: G.monsterIdCounter++, pkmId: pkm.id, pokeData: pkm,
    name: pkm.c, emoji: '', maxHp: hp, hp: hp,
    color: pkm.r === 'l' ? '#ff0044' : pkm.r === 'r' ? '#ffd700' : '#00f0ff',
    speed: getPkmSpeed(pkm) * speedBoost, y: -80, dead: false, reached: false, el: null,
  };
  const posX = 5 + (G.monsters.filter(m => !m.dead && !m.reached).length % 5) * 18;
  const el = document.createElement('div');
  el.className = 'monster';
  el.style.left = posX + '%'; el.style.top = monster.y + 'px';
  const hasIcon = pkm.i === 1;
  const iconHtml = hasIcon
    ? '<img class="m-img" src="' + getPkmIcon(pkm.id) + '" alt="' + pkm.c + '" loading="lazy" onerror="pkmIconOnError(this,' + pkm.id + ',\'' + pkm.c + '\')" width="50" height="50">'
    : '<div class="m-img-fallback" style="background:' + pkmFallbackColor(pkm.id) + '33;color:' + pkmFallbackColor(pkm.id) + ';border:2px solid ' + pkmFallbackColor(pkm.id) + '">' + pkm.c.charAt(0) + '</div>';
  el.innerHTML = iconHtml +
    
    '<div class="m-hp-wrapper"><div class="m-hp-fill" style="width:100%;background:' + monster.color + '"></div></div>';
  dom.lane.appendChild(el);
  monster.el = el;
  G.monsters.push(monster);
  updateSpawnRate();
}

function updateMonsters(dt) {
  const laneH = dom.lane.clientHeight || 300;
  const endY = laneH - 70;
  for (let i = G.monsters.length - 1; i >= 0; i--) {
    const m = G.monsters[i]; if (m.dead || m.reached) continue;
    m.y += m.speed * dt; if (m.el) m.el.style.top = m.y + 'px';
    if (m.y >= endY) {
      m.reached = true;
      if (m.el) { m.el.classList.add('reached-end'); setTimeout(() => m.el && m.el.remove(), 400); }
      const dmg = Math.max(5, 15 - G.speedLevel);
      damagePlayer(dmg);
      G.monsters.splice(i, 1);
    }
  }
}

function shootClosestMonster() {
  let closest = null, maxY = -9999;
  G.monsters.forEach(m => { if (!m.dead && !m.reached && m.y > maxY) { maxY = m.y; closest = m; } });
  if (!closest) return false;
  const dmg = G.bulletLevel * (G.doubleDamage ? 2 : 1);
  closest.hp -= dmg;
  const el = closest.el;
  if (el) {
    const hpFill = el.querySelector('.m-hp-fill');
    if (hpFill) hpFill.style.width = Math.max(0, (closest.hp / closest.maxHp) * 100) + '%';
    el.classList.remove('taking-damage'); void el.offsetWidth; el.classList.add('taking-damage');
  }
  if (closest.hp <= 0) {
    closest.dead = true;
    if (el) { const r = el.getBoundingClientRect(), ar = dom.area.getBoundingClientRect(); spawnExplosion(r.left - ar.left + r.width/2, r.top - ar.top + r.height/2, closest.color, 20); el.remove(); }
    G.monsters = G.monsters.filter(m => m !== closest);
    G.score += 10 * G.speedLevel;
    // Track kill
    const pid = closest.pkmId;
    if (pid) {
      G.pokeKills[pid] = (G.pokeKills[pid] || 0) + 1;
      const kills = G.pokeKills[pid];
      // Check unlock
      if (kills >= 10 && !G.unlocked[pid] && pid !== G.activePokemon) {
        G.unlocked[pid] = true;
        savePokeProgress();
        notify('🎉 解锁 ' + getPkmName(pid) + '！可在图鉴中切换');
        if ($('pokedex-area').classList.contains('active')) renderPokedex();
      } else if (kills === 5 || kills === 8) {
        notify(getPkmName(pid) + ' ' + kills + '/10');
      }
      savePokeProgress();
    }
    return true;
  }
  return true;
}

function buildQuestionQueue() {
  if (G.errorPool.length > 0 && Math.random() < 0.4) {
    const tw = G.errorPool.reduce((s, e) => s + e.wrongCount * 3, 0);
    let r = Math.random() * tw;
    for (const e of G.errorPool) { r -= e.wrongCount * 3; if (r <= 0) return e.question; }
  }
  const pool = G.questions.length ? G.questions : BUILTIN_QUESTIONS;
  const candidates = pool.filter(q => !G.questionHistory.slice(-5).includes(q.id));
  return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : pool[Math.floor(Math.random() * pool.length)];
}

function nextQuestion() {
  if (G.gameOver) return;
  const q = buildQuestionQueue();
  if (!q) return;
  G.currentQ = q; G.questionHistory.push(q.id);
  if (G.questionHistory.length > 50) G.questionHistory.splice(0, 15);
  dom.qNum.textContent = '第 ' + (G.totalAnswered + 1) + ' 题';
  dom.qText.textContent = q.q; dom.qText.className = 'q-text';
  dom.opts.innerHTML = '';
  q.opts.forEach((opt, i) => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = opt; btn.onclick = () => handleAnswer(i); dom.opts.appendChild(btn); });
}

function handleAnswer(index) {
  if (G.gameOver || G.isLoading) return;
  const q = G.currentQ; if (!q) return;
  const btns = dom.opts.querySelectorAll('.option-btn');
  btns.forEach(b => b.classList.add('disabled'));
  const correct = index === q.ans;
  btns[index].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[q.ans].classList.add('correct');
  G.totalAnswered++;
  if (correct) {
    G.totalCorrect++; G.combo++; G.streakCorrect++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.score += 5; G.gold += 1; skillAddCharge(5 + Math.min(G.combo, 25) * 2); saveGameData(); updateSpawnRate();
    shootClosestMonster();
    if (G.combo === 10) { G.doubleDamage = true; showComboNotify('🔥 10连击！', 'x2'); }
    else if (G.combo === 5) { showComboNotify('💪 5连击！', 'x2'); }
    if (G.streakCorrect % 10 === 0) { G.speedLevel++; dom.speed.textContent = 'Lv.' + G.speedLevel; updateSpawnRate(); }
    for (let i = G.errorPool.length - 1; i >= 0; i--) {
      if (G.errorPool[i].question.id === q.id) {
        G.errorPool[i].correctStreak = (G.errorPool[i].correctStreak || 0) + 1;
        if (G.errorPool[i].correctStreak >= 2) G.errorPool.splice(i, 1);
        break;
      }
    }
  } else {
    G.combo = 0; G.doubleDamage = false; G.streakCorrect = 0;
    let found = false;
    for (const e of G.errorPool) { if (e.question.id === q.id) { e.wrongCount++; e.correctStreak = 0; found = true; break; } }
    if (!found) G.errorPool.push({ question: q, wrongCount: 1, correctStreak: 0 });
    damagePlayer(8 + G.speedLevel * 2);
  }
  updateStats();
  setTimeout(nextQuestion, correct ? 500 : 800);
}

//  GACHA
// ============================================================
function doGacha() {
  if (G.gold < 200) { notify('金币不足！需要 200 金币'); return; }
  // Find unowned Pokemon that can be unlocked (has icon)
  const unowned = PKM.filter(p => p.i === 1 && !G.unlocked[p.id] && p.id !== DEFAULT_POKEMON_ID);
  if (unowned.length === 0) { notify('🎉 所有宝可梦已解锁！'); return; }
  G.gold -= 200;
  saveGameData();
  // Weighted random: rarity r = higher rarity = lower chance
  const weights = unowned.map(p => {
    if (TIER1_LEGEND.has(p.id) || MYTHICAL_PKMN.has(p.id)) return 1;
    if (TIER2_LEGEND.has(p.id)) return 3;
    const w = {c:40, u:20, r:8, l:3};
    return w[p.r] || 10;
  });
  const totalW = weights.reduce((a, b) => a + b, 0);
  let rv = Math.random() * totalW;
  let chosen = unowned[0];
  for (let i = 0; i < unowned.length; i++) {
    rv -= weights[i];
    if (rv <= 0) { chosen = unowned[i]; break; }
  }
  G.unlocked[chosen.id] = true;
  savePokeProgress();
  const rarityLabel = getRarityLabel(chosen.r);
  notify('🎉 抽到 ' + chosen.c + '（' + rarityLabel + '）！');
  if ($('pokedex-area').classList.contains('active')) renderPokedex();
  updateUpgradeUI();
}

function importQuestions(event) {
  const file = event.target.files[0]; if (!file) return;
  G.isLoading = true;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const content = e.target.result;
      let parsed = JSON.parse(content);
      if (!Array.isArray(parsed) || parsed.length === 0) { alert('格式错误：需要非空数组'); G.isLoading = false; return; }
      const valid = parsed.every(q => q.question && q.options && Array.isArray(q.options) && q.options.length >= 2 && typeof q.answer === 'number');
      if (!valid) { alert('格式错误：需要 question, options(数组), answer(数字)'); G.isLoading = false; return; }
      G.questions = parsed.map((q, i) => ({ id: q.id || 'import_' + i, q: q.question, opts: q.options, ans: q.answer }));
      G.allQuestions = [...G.questions];
      G.bankPage = 1; G.bankFilter = 'all';
      try { localStorage.setItem('drivingDefenseImportedBank', JSON.stringify(G.allQuestions)); } catch(e) {}
      G.errorPool = []; G.questionHistory = [];
      G.hp = G.maxHp; G.score = 0; G.combo = 0; G.maxCombo = 0; G.speedLevel = 1; G.streakCorrect = 0; G.totalAnswered = 0; G.totalCorrect = 0; G.gameOver = false;
      for (const m of G.monsters) { if (m.el) m.el.remove(); } G.monsters = [];
      updateStats(); nextQuestion(); saveDailyStats();
      alert('成功导入 ' + G.questions.length + ' 道题！');
    } catch(err) { alert('解析失败：' + err.message); }
    G.isLoading = false; event.target.value = '';
  };
  reader.readAsText(file);
}

    const item = document.createElement('div'); item.className = 'bank-item';
    item.innerHTML = '<div class="bank-item-header" onclick="this.parentElement.classList.toggle(\'expanded\')"><span class="q-num">#' + idx + '</span><span class="q-preview">' + preview + '</span><span class="q-toggle">▼</span></div><div class="bank-item-detail">' +
      q.opts.map((o, i) => '<div class="detail-opt' + (i === q.ans ? ' is-ans' : '') + '">' + String.fromCharCode(65+i) + '. ' + o.replace(/^[A-D][.、]\s*/, '') + '</div>').join('') +
      '<div class="detail-ans">✅ ' + answerLetter + '</div></div>';
    list.appendChild(item);
  });
}
function filterBank() { G.bankPage = 1; renderBank(); }
function bankPage(d) {
  const total = Math.max(1, Math.ceil(getFilteredQuestions().length / BANK_PAGE_SIZE));
  G.bankPage = Math.max(1, Math.min(total, G.bankPage + d));
  renderBank(); $('bank-list').scrollTop = 0;
}

// ============================================================
//  CONFIRM
// ============================================================
function showConfirm(text, onConfirm) {
  const overlay = document.getElementById('confirm-dialog');
  document.getElementById('confirm-text').textContent = text; overlay.classList.add('show');
  const cleanup = () => { overlay.classList.remove('show'); document.getElementById('confirm-ok').onclick = null; document.getElementById('confirm-cancel').onclick = null; };
  document.getElementById('confirm-ok').onclick = () => { cleanup(); onConfirm(); };
  document.getElementById('confirm-cancel').onclick = cleanup;
}
function confirmReset() {
  showConfirm('确定重置所有数据？（金币、升级、图鉴进度都会清除）', () => {
    ['drivingDefenseStats','drivingDefenseUpgrades','drivingDefenseBest','drivingDefenseImportedBank','drivingDefensePokeKills','drivingDefensePokeUnlocks','drivingDefenseActivePkm'].forEach(k => localStorage.removeItem(k));
    G.errorPool = []; G.questionHistory = []; G.totalAnswered = 0; G.totalCorrect = 0;
    G.gold = 200; G.bulletLevel = 1; G.hpLevel = 1; G.score = 0; G.combo = 0; G.maxCombo = 0; G.speedLevel = 1; G.streakCorrect = 0; G.doubleDamage = false;
    G.skillCharge = 0; G.pokeKills = {}; G.unlocked = {}; G.unlocked[DEFAULT_POKEMON_ID] = true; G.activePokemon = DEFAULT_POKEMON_ID;
    G.maxHp = getMaxHPFromLevel(); G.hp = G.maxHp;
    updateStats(); loadBestScore(); saveDailyStats(); updateActivePkmDisplay();
    if ($('pokedex-area').classList.contains('active')) renderPokedex();
  });
}

// ============================================================
//  GAME LOOP
// ============================================================
let lastTime = 0, gameLoopTimer = null;
function gameLoop(time) {
  if (G.gameOver) { if (!G._loopStopped) G._loopStopped = true; return; }
  if (!lastTime) { lastTime = time; return; }
  const dt = Math.min((time - lastTime) / 1000, 0.05); lastTime = time;
  try { updateMonsters(dt); } catch(e) {}
  G.animFrame = requestAnimationFrame(gameLoop);
}
function startGameLoop() {
  lastTime = performance.now(); G.animFrame = requestAnimationFrame(gameLoop);
  if (gameLoopTimer) clearInterval(gameLoopTimer);
  gameLoopTimer = setInterval(() => { if (!G.gameOver && G.monsters.length > 0) { const now = performance.now(); updateMonsters(Math.min((now - lastTime) / 1000, 0.05)); lastTime = now; } }, 50);
}

// ============================================================
//  UPDATE STATS
// ============================================================
function updateStats() {
  dom.hp.textContent = Math.ceil(G.hp);
  dom.hp.className = 'val ' + (G.hp > 60 ? 'hp-ok' : G.hp > 30 ? 'hp-warn' : 'hp-danger');
  dom.score.textContent = G.score;
  dom.combo.textContent = G.combo + (G.doubleDamage ? ' 💥' : '');
  dom.combo.className = 'val' + (G.combo >= 10 ? ' combo-fire' : '');
  updateUpgradeUI(); updateTodayStats(); saveDailyStats();
}

// ============================================================
//  INIT
// ============================================================
function loadExternalQuestions() {
  try { var saved = localStorage.getItem('drivingDefenseImportedBank'); if (saved) { var d = JSON.parse(saved); if (Array.isArray(d) && d.length > 0) { G.allQuestions = d; G.questions = shuffle([...G.allQuestions]); return; } } } catch(e) {}
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'questions_bank.json?' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200 || xhr.status === 0) {
      try { var data = JSON.parse(xhr.responseText); if (Array.isArray(data) && data.length > 0) { G.allQuestions = data.map(function(q) { return { id: q.id || q.question?.slice(0,10), q: q.q || q.question, opts: q.opts || q.options, ans: q.ans || q.answer || 0 }; }); G.questions = shuffle([...G.allQuestions]); return; } } catch(e) {}
    }
    G.allQuestions = BUILTIN_QUESTIONS.map(q => ({...q})); G.questions = shuffle([...G.allQuestions]);
  };
  xhr.onerror = function() { G.allQuestions = BUILTIN_QUESTIONS.map(q => ({...q})); G.questions = shuffle([...G.allQuestions]); };
  xhr.send();
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function loadPokemonData() {
  return new Promise((resolve) => {
    // 数据已通过 <script src="pokemon_data.js"> 全局加载
    if (typeof POKEMON_DATA !== 'undefined' && POKEMON_DATA.length > 0) {
      PKM = POKEMON_DATA;
      console.log('✅ 已加载 ' + PKM.length + ' 只宝可梦数据');
      resolve(true);
    } else {
      // 兜底：至少保证皮卡丘可用
      PKM = [{ id:25, n:'pikachu', c:'皮卡丘', r:'c', i:1 }];
      console.warn('⚠️ 宝可梦数据未加载，使用兜底');
      resolve(false);
    }
  });
}

function initGame() {
  resizeCanvas(); initBgParticles();
  loadGameData(); loadPokeProgress();
  G.maxHp = getMaxHPFromLevel(); G.hp = G.maxHp;
  updateUpgradeUI(); loadBestScore();
  renderParticles();
  loadDailyBase(); updateTodayStats();
  loadExternalQuestions();
  updateActivePkmDisplay(); skillUpdateUI();
  // Load Pokemon data
  loadPokemonData().then(() => {
    $('pokedex-total').textContent = PKM.length;
    // Ensure Pikachu is unlocked
    G.unlocked[DEFAULT_POKEMON_ID] = true;
    // 重新刷新显示（PKM 此时才可用）
    updateActivePkmDisplay(); skillUpdateUI();
  });
}

function startGame() {
  $('start-screen').style.display = 'none';
  updateSpawnRate(); startGameLoop();
  setTimeout(nextQuestion, 500);
  setTimeout(spawnMonster, 800);
  setTimeout(spawnMonster, 2200);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (G.gameOver) { if (e.key === 'Enter' || e.key === ' ') restartGame(); return; }
  const keys = ['1','2','3','4','a','b','c','d'];
  const idx = keys.indexOf(e.key.toLowerCase());
  if (idx >= 0) { const btns = dom.opts.querySelectorAll('.option-btn'); const t = idx >= 4 ? idx - 4 : idx; if (btns[t] && !btns[t].classList.contains('disabled')) btns[t].click(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !G.gameOver) lastTime = performance.now(); });

initGame();
</script>

<div class="confirm-overlay" id="confirm-dialog">
  <div class="confirm-box">
    <div class="confirm-text" id="confirm-text"></div>
    <div class="confirm-btns">
      <button class="btn-cancel" id="confirm-cancel">取消</button>
      <button class="btn-confirm" id="confirm-ok">确定</button>
    </div>
  </div>
</div>
</body>
</html>
